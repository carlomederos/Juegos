{% extends "maestra.html" %}

{% block titulo %}
Método no permitido (405)
{% endblock %}

{% block contenido %}
<section class="section">
    <div class="container">
        <div class="notification is-warning is-light">
            <h1 class="title">405 - Método no permitido</h1>
            <p>
                La solicitud utiliza un método HTTP que no está
                permitido para esta dirección.
            </p>

            <a href="{{ url_for('juegos') }}" class="button is-warning mt-4">
                Volver a videojuegos
            </a>
        </div>
    </div>
</section>
{% endblock %}
