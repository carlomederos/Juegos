{% extends "maestra.html" %}

{% block titulo %}
Solicitud incorrecta (400)
{% endblock %}

{% block contenido %}
<section class="section">
    <div class="container">
        <div class="notification is-warning is-light">
            <h1 class="title">400 - Solicitud incorrecta</h1>
            <p>
                Los datos enviados no son válidos o falta información
                necesaria para procesar la solicitud.
            </p>

            <a href="{{ url_for('juegos') }}" class="button is-warning mt-4">
                Volver a videojuegos
            </a>
        </div>
    </div>
</section>
{% endblock %}
